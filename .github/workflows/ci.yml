name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.service }} (lint + test + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders, payments, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: RabbitMQ flow (compose + newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for orders to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8083/health > /dev/null; then
              echo "orders healthy"; exit 0
            fi
            sleep 5
          done
          echo "orders did not become healthy" >&2
          docker compose logs --no-color
          exit 1

      - name: Run Postman collection
        run: npx -y newman run postman/omnistore.postman_collection.json -e postman/omnistore.postman_environment.json

      - name: Teardown
        if: always()
        run: docker compose down -v

  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for SonarCloud token
        id: sonar-check
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud scan
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
